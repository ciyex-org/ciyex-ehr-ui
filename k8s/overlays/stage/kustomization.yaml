apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: ciyex-ehr-ui
    count: 1

images:
  - name: hinikubestageacr.azurecr.io/ciyex-ehr-ui
    newTag: "1"

patches:
  - target:
      kind: HTTPRoute
      name: ciyex-ehr-ui
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: app-stage.ciyex.org
