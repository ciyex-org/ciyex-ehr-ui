apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: registry.apps-prod.us-east.in.hinisoft.com/ciyex-ehr-ui
    newTag: "0.0.1-rc"

patches:
  - target:
      kind: HTTPRoute
      name: ciyex-ehr-ui
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: ehr.apps-stage.us-east.in.hinisoft.com
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

bases:
  - ../../base

nameSuffix: -stage

images:
  - name: ciyex-ehr-ui
    newName: IMAGE_URL
    newTag: IMAGE_TAG

replicas:
  - name: ciyex-ehr-ui
    count: 1

patches:
  - path: deployment-patch.yaml
  - path: ingress-patch.yaml

configMapGenerator:
  - name: ehr-ui-config
    literals:
      - NODE_ENV=staging
      - NEXT_PUBLIC_API_URL=https://stg.ciyex.com/api
