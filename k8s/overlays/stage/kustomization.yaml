apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: ciyex-ehr-ui
    count: 1

images:
  - name: registry.apps-prod.us-east.in.hinisoft.com/ciyex-ehr-ui
    newTag: "0.0.1-rc"

patches:
  - target:
      kind: HTTPRoute
      name: ciyex-ehr-ui
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: app-stage.ciyex.org
