apiVersion: apps/v1
kind: Deployment
metadata:
  name: ciyex-ehr-ui
  labels:
    app: ciyex-ehr-ui
    app.kubernetes.io/name: ciyex-ehr-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ciyex-ehr-ui
  template:
    metadata:
      labels:
        app: ciyex-ehr-ui
    spec:
      imagePullSecrets:
        - name: registry-creds
      containers:
        - name: ciyex-ehr-ui
          image: registry.apps-prod.us-east.in.hinisoft.com/ciyex-ehr-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - configMapRef:
                name: ehr-ui-config
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
